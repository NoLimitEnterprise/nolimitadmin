<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Limit Webhosting Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: #161b22; border: 1px solid #30363d; }
        .text-success { color: #39d353 !important; }
        h1, h4 { color: #58a6ff; }
        .table-dark { --bs-table-bg: #161b22; --bs-table-color: #c9d1d9; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <h1>Welcome, brandon - No Limit Webhosting Dashboard</h1>
        <p class="text-success">Node Overview (Live data updating every 10s)</p>

        <div id="nodes-container" class="row g-4 mb-5"></div>

        <h4 class="mt-5 mb-3">Recent VMs / LXCs</h4>
        <div id="vms-container" class="row g-4"></div>

        <h4 class="mt-5 mb-3">Running Services</h4>
        <div class="table-responsive">
            <table class="table table-dark table-hover" id="services-table">
                <thead>
                    <tr>
                        <th>Node</th>
                        <th>Service</th>
                        <th>Status</th>
                        <th>Memory (MB)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        function loadDashboard() {
            fetch('/monitor/api/nodes/')
                .then(r => r.json())
                .then(nodes => {
                    // Nodes
                    let nodeHTML = '';
                    nodes.forEach(node => {
                        nodeHTML += `
                            <div class="col-lg-4 col-md-6">
                                <div class="card h-100">
                                    <div class="card-body">
                                        <h5 class="card-title text-success">${node.hostname}</h5>
                                        <p class="small text-muted">Last seen: ${new Date(node.last_seen).toLocaleString()}</p>
                                        <button class="btn btn-outline-primary btn-sm" onclick="viewNode('${node.hostname}')">View Full Details</button>
                                    </div>
                                </div>
                            </div>`;
                    });
                    document.getElementById('nodes-container').innerHTML = nodeHTML || '<p class="text-muted">No nodes found yet...</p>';

                    // VMs (from latest snapshot of first node for now)
                    if (nodes.length > 0) {
                        fetch(`/monitor/api/node/${nodes[0].hostname}/latest/`)
                            .then(r => r.json())
                            .then(data => {
                                let vmHTML = '';
                                (data.vms || []).forEach(vm => {
                                    vmHTML += `
                                        <div class="col-lg-3 col-md-4">
                                            <div class="card">
                                                <div class="card-body">
                                                    <h6>${vm.name} <span class="badge bg-${vm.status === 'running' ? 'success' : 'secondary'}">${vm.status}</span></h6>
                                                    <small class="text-muted">${vm.type.toUpperCase()} • VMID ${vm.vmid}</small>
                                                </div>
                                            </div>
                                        </div>`;
                                });
                                document.getElementById('vms-container').innerHTML = vmHTML || '<p class="text-muted">No VMs detected yet</p>';
                            });
                    }
                })
                .catch(err => console.error('Error loading dashboard:', err));
        }

        function viewNode(hostname) {
            alert(`Deep dive for ${hostname} coming in next update (VMs, Services, Network, Packet Capture)`);
        }

        // Auto-refresh
        setInterval(loadDashboard, 10000);
        loadDashboard(); // initial load
    </script>
</body>
</html>
