<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Limit Webhosting Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; }
        .card { background: #161b22; border: 1px solid #30363d; transition: all 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #58a6ff; }
        .node-card { border-left: 5px solid #39d353; }
        .status-running { background: #238636; color: white; }
        .status-stopped { background: #da3633; color: white; }
        h1 { color: #58a6ff; }
        .refresh { color: #39d353; font-size: 0.9rem; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <h1 class="mb-1">Welcome, brandon - No Limit Webhosting Dashboard</h1>
        <p class="refresh mb-4">Node Overview <span class="text-success">(Live • updating every 10s)</span></p>

        <!-- Nodes -->
        <div class="row g-3 mb-5" id="nodes-container"></div>

        <!-- VMs / LXCs -->
        <h4 class="text-light mb-3">Recent VMs / LXCs</h4>
        <div class="row g-3 mb-5" id="vms-container"></div>

        <!-- Services -->
        <h4 class="text-light mb-3">Running Services</h4>
        <div class="table-responsive">
            <table class="table table-dark table-hover" id="services-table">
                <thead>
                    <tr>
                        <th>Node</th>
                        <th>Service</th>
                        <th>Status</th>
                        <th>Memory</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        function loadDashboard() {
            fetch('/monitor/api/nodes/')
                .then(r => r.json())
                .then(nodes => {
                    let nodeHTML = '';
                    nodes.forEach(node => {
                        nodeHTML += `
                            <div class="col-lg-4 col-md-6">
                                <div class="card node-card h-100">
                                    <div class="card-body">
                                        <h5 class="card-title text-success">${node.hostname}</h5>
                                        <p class="small text-muted">Last seen: ${new Date(node.last_seen).toLocaleString()}</p>
                                        <div class="d-flex gap-2">
                                            <button class="btn btn-outline-primary btn-sm" onclick="viewNode('${node.hostname}')">
                                                <i class="fas fa-server"></i> Details
                                            </button>
                                            <button class="btn btn-outline-danger btn-sm" onclick="capturePackets('${node.hostname}')">
                                                <i class="fas fa-broadcast-tower"></i> Capture
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>`;
                    });
                    document.getElementById('nodes-container').innerHTML = nodeHTML;
                });

            // Load VMs from km01 for now (expand later)
            fetch('/monitor/api/node/km01/latest/')
                .then(r => r.json())
                .then(data => {
                    let vmHTML = '';
                    (data.vms || []).forEach(vm => {
                        const statusClass = vm.status === 'running' ? 'status-running' : 'status-stopped';
                        vmHTML += `
                            <div class="col-lg-3 col-md-4 col-sm-6">
                                <div class="card">
                                    <div class="card-body">
                                        <h6 class="mb-1">${vm.name}</h6>
                                        <span class="badge ${statusClass}">${vm.status}</span>
                                        <small class="text-muted d-block mt-2">${vm.type.toUpperCase()} • VMID ${vm.vmid}</small>
                                    </div>
                                </div>
                            </div>`;
                    });
                    document.getElementById('vms-container').innerHTML = vmHTML || '<p class="text-muted">No VMs detected yet</p>';
                });
        }

        function viewNode(hostname) {
            alert(`Deep dive for ${hostname} (VMs, Services, Network, History) - coming next update`);
        }

        function capturePackets(hostname) {
            if (confirm(`Start 120-second packet capture on vmbr0 for ${hostname}?`)) {
                fetch(`/monitor/api/capture/${hostname}/`)
                    .then(r => r.json())
                    .then(data => alert(`Packet capture started on ${hostname}!`))
                    .catch(() => alert('Capture request sent'));
            }
        }

        // Auto refresh
        setInterval(loadDashboard, 10000);
        loadDashboard();
    </script>
</body>
</html>
