<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Login - No Limit Webhosting</title>
    <style>
        body { background: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 150px 20px; }
        form { max-width: 400px; margin: 0 auto; }
        input { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; }
        button { background: #ff0000; color: white; padding: 15px; font-size: 18px; border: none; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h1>Secure Login</h1>
    {% if messages %}
        {% for message in messages %}
            <p style="color: #ffcc00;">{{ message }}</p>
        {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
